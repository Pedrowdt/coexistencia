<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>blog</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0c0c0f;
  --surface: #111116;
  --text:    #cdc7bc;
  --muted:   #484540;
  --accent:  #8c1b28;
  --link:    #c13a2b;
  --border:  #1e1e22;
  --fb: Georgia, 'Times New Roman', serif;
  --fm: 'Courier New', Courier, monospace;
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--fb);
  font-size: 16px;
  line-height: 1.75;
  min-height: 100vh;
}

/* ── HEADER ─────────────────────────────── */
#hdr {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
}
#hdr-inner {
  max-width: 1000px; margin: 0 auto;
  padding: 14px 24px;
  display: flex; align-items: center; gap: 16px;
}
#blog-name {
  font-size: 18px; font-weight: normal;
  color: var(--text); cursor: pointer;
  text-decoration: none; letter-spacing: -0.4px;
}
#blog-name b { color: var(--accent); font-weight: normal; }
#hdr-tagline {
  font-family: var(--fm); font-size: 11px;
  color: var(--muted); letter-spacing: 0.3px;
}
#hdr-nav { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.nav-btn {
  background: none; border: none;
  color: var(--muted); font-family: var(--fm);
  font-size: 11px; cursor: pointer; padding: 0;
  letter-spacing: 0.3px; transition: color .15s;
}
.nav-btn:hover { color: var(--text); }
.nav-new {
  color: var(--accent);
  border: 1px solid var(--accent) !important;
  padding: 5px 12px !important;
  transition: background .15s, color .15s;
}
.nav-new:hover { background: var(--accent); color: #fff; }

/* ── LAYOUT ──────────────────────────────── */
#layout {
  max-width: 1000px; margin: 0 auto;
  padding: 44px 24px 80px;
  display: grid;
  grid-template-columns: 1fr 200px;
  gap: 60px;
}
@media (max-width: 680px) {
  #layout { grid-template-columns: 1fr; }
  #sidebar { display: none; }
}

/* ── POST LIST ───────────────────────────── */
.p-item {
  padding-bottom: 36px;
  margin-bottom: 36px;
  border-bottom: 1px solid var(--border);
}
.p-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.p-date {
  font-family: var(--fm); font-size: 11px;
  color: var(--muted); margin-bottom: 8px;
}
.p-title {
  font-size: 22px; font-weight: normal;
  line-height: 1.3; margin-bottom: 10px; letter-spacing: -.3px;
}
.p-title a { color: var(--text); text-decoration: none; cursor: pointer; }
.p-title a:hover { color: var(--link); }
.p-excerpt {
  font-size: 15px; line-height: 1.7;
  color: var(--text); opacity: .82; margin-bottom: 14px;
  max-width: 60ch;
}
.p-footer { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tag {
  font-family: var(--fm); font-size: 10px;
  color: var(--muted); border: 1px solid var(--border);
  padding: 2px 7px; cursor: pointer; letter-spacing: .3px;
  transition: color .1s, border-color .1s;
}
.tag:hover, .tag.on { color: var(--link); border-color: var(--link); }
.read-more {
  font-family: var(--fm); font-size: 11px;
  color: var(--link); background: none; border: none;
  cursor: pointer; padding: 0; letter-spacing: .3px;
}
.empty-state {
  text-align: center; padding: 64px 0; color: var(--muted);
}
.empty-state p { font-family: var(--fm); font-size: 13px; margin-bottom: 16px; }
.empty-state button {
  font-family: var(--fm); font-size: 11px;
  color: var(--accent); background: none;
  border: 1px solid var(--accent); padding: 7px 18px; cursor: pointer;
}

/* ── FILTER BAR ──────────────────────────── */
#filter-bar {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 32px; flex-wrap: wrap;
  font-family: var(--fm); font-size: 11px; color: var(--muted);
}
.filter-clear {
  color: var(--link); background: none; border: none;
  font-family: var(--fm); font-size: 11px; cursor: pointer; padding: 0;
}

/* ── SINGLE POST ─────────────────────────── */
.back-btn {
  font-family: var(--fm); font-size: 11px; color: var(--muted);
  background: none; border: none; cursor: pointer;
  padding: 0; margin-bottom: 32px; display: block;
  letter-spacing: .3px; transition: color .1s;
}
.back-btn:hover { color: var(--text); }
.s-title {
  font-size: 28px; font-weight: normal;
  line-height: 1.25; margin-bottom: 14px; letter-spacing: -.5px;
}
.s-meta {
  font-family: var(--fm); font-size: 11px;
  color: var(--muted); margin-bottom: 36px;
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  padding-bottom: 24px; border-bottom: 1px solid var(--border);
}
.s-actions { margin-left: auto; display: flex; gap: 6px; }
.btn-edit {
  color: var(--muted); background: none;
  border: 1px solid var(--border); font-family: var(--fm);
  font-size: 10px; padding: 3px 9px; cursor: pointer;
  transition: color .1s, border-color .1s;
}
.btn-edit:hover { color: var(--text); border-color: var(--muted); }
.btn-del-sm {
  color: #6b1515; background: none;
  border: 1px solid #2e0c0c; font-family: var(--fm);
  font-size: 10px; padding: 3px 9px; cursor: pointer;
  transition: background .1s;
}
.btn-del-sm:hover { background: #200808; }

/* ── RENDERED MARKDOWN ───────────────────── */
.md { font-size: 16px; line-height: 1.8; }
.md h1, .md h2, .md h3, .md h4 { font-weight: normal; line-height: 1.3; }
.md h1 { font-size: 24px; margin: 2em 0 .8em; }
.md h2 {
  font-size: 20px; margin: 2em 0 .75em;
  color: var(--muted);
  border-bottom: 1px solid var(--border); padding-bottom: 6px;
}
.md h3 { font-size: 17px; margin: 1.6em 0 .6em; }
.md h4 { font-size: 15px; margin: 1.4em 0 .5em; color: var(--muted); }
.md p { margin-bottom: 1.2em; max-width: 64ch; }
.md a { color: var(--link); }
.md a:hover { text-decoration: underline; }
.md blockquote {
  border-left: 2px solid var(--accent);
  padding-left: 20px; margin: 1.5em 0;
  color: var(--muted); font-style: italic;
}
.md blockquote p { max-width: 58ch; }
.md code {
  font-family: var(--fm); font-size: 13px;
  background: var(--surface); padding: 1px 5px;
  border: 1px solid var(--border);
}
.md pre {
  background: var(--surface); border: 1px solid var(--border);
  padding: 16px; overflow-x: auto; margin: 1.5em 0;
}
.md pre code { background: none; border: none; padding: 0; font-size: 13px; }
.md img {
  max-width: 100%; margin: 1.5em 0; display: block;
  border: 1px solid var(--border);
}
.md ul, .md ol { margin: 1em 0 1.2em 1.5em; }
.md li { margin-bottom: .4em; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
.md strong { font-weight: bold; color: var(--text); }
.md em { font-style: italic; }
.video-wrap {
  margin: 1.5em 0;
  position: relative; padding-bottom: 56.25%; height: 0;
  overflow: hidden; background: var(--surface);
  border: 1px solid var(--border);
}
.video-wrap iframe {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; border: none;
}

/* ── SIDEBAR ─────────────────────────────── */
#sidebar { padding-top: 4px; }
.sb-section { margin-bottom: 28px; }
.sb-label {
  font-family: var(--fm); font-size: 10px;
  color: var(--muted); letter-spacing: .5px;
  text-transform: uppercase; margin-bottom: 10px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.sb-link {
  display: block; font-family: var(--fm); font-size: 12px;
  color: var(--muted); padding: 3px 0; cursor: pointer;
  background: none; border: none; text-align: left;
  width: 100%; transition: color .1s;
}
.sb-link:hover { color: var(--text); }
.sb-count { float: right; opacity: .55; }

/* ── EDITOR ──────────────────────────────── */
#editor-wrap { max-width: 820px; }
.ed-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 28px; padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.ed-heading { font-size: 16px; font-weight: normal; color: var(--muted); }
.ed-cancel {
  font-family: var(--fm); font-size: 11px; color: var(--muted);
  background: none; border: none; cursor: pointer; padding: 0;
  margin-left: auto; transition: color .1s;
}
.ed-cancel:hover { color: var(--text); }
.ed-field { margin-bottom: 18px; }
.ed-label {
  font-family: var(--fm); font-size: 11px; color: var(--muted);
  display: block; margin-bottom: 6px; letter-spacing: .2px;
}
.ed-input {
  width: 100%; background: var(--surface);
  border: 1px solid var(--border); color: var(--text);
  font-family: var(--fb); font-size: 16px;
  padding: 9px 13px; outline: none; transition: border .15s;
}
.ed-input:focus { border-color: var(--accent); }
.ed-input.mono { font-family: var(--fm); font-size: 13px; }

#ed-toolbar {
  display: flex; gap: 3px;
  flex-wrap: wrap; margin-bottom: 0;
}
.tb { 
  background: var(--surface); border: 1px solid var(--border);
  color: var(--muted); font-family: var(--fm); font-size: 11px;
  padding: 4px 10px; cursor: pointer; transition: color .1s, border-color .1s;
  line-height: 1.4;
}
.tb:hover { color: var(--text); border-color: var(--muted); }
.tb-sep { width: 1px; background: var(--border); margin: 4px 2px; }

.ed-tabs {
  display: flex; margin-top: 10px; margin-bottom: -1px;
  position: relative; z-index: 1;
}
.ed-tab {
  font-family: var(--fm); font-size: 11px; color: var(--muted);
  background: none; border: 1px solid transparent;
  padding: 5px 14px; cursor: pointer; letter-spacing: .3px;
  transition: color .1s;
}
.ed-tab.on {
  color: var(--text); background: var(--surface);
  border-color: var(--border); border-bottom-color: var(--surface);
}
.ed-tab:hover:not(.on) { color: var(--text); }

#ed-body {
  width: 100%; min-height: 440px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-family: var(--fm); font-size: 13px;
  line-height: 1.7; padding: 16px; resize: vertical;
  outline: none; transition: border .15s; tab-size: 2;
}
#ed-body:focus { border-color: var(--accent); }
#preview-body {
  min-height: 440px; background: var(--surface);
  border: 1px solid var(--border); padding: 24px; overflow-y: auto;
}
.hidden { display: none !important; }

.ed-actions { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
.btn-pub {
  background: var(--accent); border: 1px solid var(--accent);
  color: #fff; font-family: var(--fm); font-size: 12px;
  padding: 9px 24px; cursor: pointer; letter-spacing: .5px;
  transition: opacity .15s;
}
.btn-pub:hover { opacity: .85; }
.btn-sec {
  background: none; border: 1px solid var(--border);
  color: var(--muted); font-family: var(--fm); font-size: 12px;
  padding: 9px 18px; cursor: pointer; letter-spacing: .3px;
  transition: color .1s, border-color .1s;
}
.btn-sec:hover { color: var(--text); border-color: var(--muted); }
.btn-del-ed {
  background: none; border: 1px solid #2a0808;
  color: #7a1515; font-family: var(--fm); font-size: 12px;
  padding: 9px 18px; cursor: pointer; margin-left: auto;
  transition: background .1s;
}
.btn-del-ed:hover { background: #180404; }
#save-msg {
  font-family: var(--fm); font-size: 11px;
  color: var(--muted); margin-top: 10px; min-height: 1.4em;
}

/* ── CONFIG MODAL ────────────────────────── */
#cfg-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.88); z-index: 200;
  align-items: center; justify-content: center;
}
#cfg-overlay.open { display: flex; }
#cfg-box {
  background: var(--surface); border: 1px solid var(--border);
  padding: 32px; width: 100%; max-width: 440px;
}
#cfg-box h2 {
  font-size: 15px; font-weight: normal;
  margin-bottom: 24px; color: var(--text);
  font-family: var(--fm); letter-spacing: .3px;
  border-bottom: 1px solid var(--border); padding-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
#cfg-box h2 button {
  font-family: var(--fm); font-size: 11px; color: var(--muted);
  background: none; border: none; cursor: pointer;
}
#cfg-box h2 button:hover { color: var(--text); }

/* ── LOADING ─────────────────────────────── */
#loading {
  padding: 60px 24px;
  font-family: var(--fm); font-size: 12px; color: var(--muted);
  text-align: center;
}
</style>
</head>

<body>
<div id="app"><div id="loading">carregando…</div></div>
<input type="file" id="file-input" accept="image/*" style="display:none">

<!-- CONFIG MODAL (static DOM, always present) -->
<div id="cfg-overlay">
  <div id="cfg-box">
    <h2>configurar blog <button onclick="closeCfg()">fechar ×</button></h2>
    <div class="ed-field">
      <label class="ed-label">nome do blog</label>
      <input class="ed-input" id="cfg-title" type="text" placeholder="k-blog">
    </div>
    <div class="ed-field">
      <label class="ed-label">tagline</label>
      <input class="ed-input mono" id="cfg-tagline" type="text" placeholder="escrita crítica">
    </div>
    <div class="ed-field">
      <label class="ed-label">sobre (markdown)</label>
      <textarea class="ed-input mono" id="cfg-about" rows="5"
        placeholder="Escreva algo sobre o blog…"></textarea>
    </div>
    <div class="ed-actions">
      <button class="btn-pub" onclick="saveCfg()">salvar</button>
      <button class="btn-sec" onclick="closeCfg()">cancelar</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
const S = {
  view: 'list',           // 'list' | 'post' | 'editor'
  posts: [],
  currentId: null,
  editPost: null,
  filterTag: null,
  filterMonth: null,
  tab: 'write',           // 'write' | 'preview'
  cfg: { title: 'k-blog', tagline: 'escrita crítica', about: '' },
};

// ═══════════════════════════════════════════════
//  STORAGE  (localStorage — funciona em qualquer hospedagem estática)
// ═══════════════════════════════════════════════
const LS_PREFIX = 'kblog:';

function lsGet(key) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function lsSet(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); return true; }
  catch (e) { console.error('Erro ao salvar:', e); return false; }
}
function lsDel(key) {
  try { localStorage.removeItem(LS_PREFIX + key); } catch {}
}
function lsKeys(prefix) {
  const out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(LS_PREFIX + prefix)) out.push(k.slice(LS_PREFIX.length));
  }
  return out;
}

const db = {
  async loadPosts() {
    const keys = lsKeys('post:');
    const out = [];
    for (const k of keys) {
      const p = lsGet(k);
      if (p) out.push(p);
    }
    return out.sort((a,b) => new Date(b.date)-new Date(a.date));
  },
  async savePost(p) {
    lsSet('post:'+p.id, p);
  },
  async delPost(id) {
    lsDel('post:'+id);
  },
  async loadCfg() {
    return lsGet('__cfg__');
  },
  async saveCfg(c) {
    lsSet('__cfg__', c);
  },
  async exportAll() {
    const posts = await this.loadPosts();
    const cfg = await this.loadCfg();
    return JSON.stringify({ cfg, posts }, null, 2);
  },
  async importAll(json) {
    const data = JSON.parse(json);
    if (data.cfg) await this.saveCfg(data.cfg);
    if (data.posts) for (const p of data.posts) await this.savePost(p);
  },
};

// ═══════════════════════════════════════════════
//  MARKDOWN & HELPERS
// ═══════════════════════════════════════════════
if (typeof marked !== 'undefined') marked.setOptions({ breaks: true, gfm: true });

function videoEmbed(url) {
  url = url.trim();
  let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if (m) return `<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen></iframe></div>`;
  m = url.match(/vimeo\.com\/(\d+)/);
  if (m) return `<div class="video-wrap"><iframe src="https://player.vimeo.com/video/${m[1]}" allowfullscreen></iframe></div>`;
  return `<div class="video-wrap"><iframe src="${url}" allowfullscreen></iframe></div>`;
}

function renderMd(src) {
  if (!src) return '';
  const processed = src.replace(/\{\{video:(.*?)\}\}/g, (_, u) => videoEmbed(u));
  return typeof marked !== 'undefined' ? marked.parse(processed) : processed.replace(/\n/g,'<br>');
}

function excerpt(src, n=230) {
  const t = src
    .replace(/\{\{video:[^}]+\}\}/g,'')
    .replace(/!\[[^\]]*\]\([^)]+\)/g,'')
    .replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/#{1,6}\s+/g,'')
    .replace(/[*_`]/g,'')
    .replace(/\n+/g,' ').trim();
  return t.length > n ? t.slice(0,n)+'…' : t;
}

function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getDate()} ${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDateLong(iso) {
  const d = new Date(iso);
  return `${d.getDate()} de ${'janeiro fevereiro março abril maio junho julho agosto setembro outubro novembro dezembro'.split(' ')[d.getMonth()]} de ${d.getFullYear()}`;
}
function slugify(s) {
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
}
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function uid() { return Date.now()+'-'+Math.random().toString(36).slice(2,7); }

// ═══════════════════════════════════════════════
//  RENDER ENGINE
// ═══════════════════════════════════════════════
const app = () => document.getElementById('app');

function render() {
  let html = '';
  if (S.view === 'list')   html = vList();
  if (S.view === 'post')   html = vPost();
  if (S.view === 'editor') html = vEditor();
  app().innerHTML = html;
  afterRender();
}

function afterRender() {
  if (S.view === 'editor') {
    const ta = document.getElementById('ed-body');
    if (ta && S.editPost) ta.value = S.editPost.content || '';
  }
}

// ── Header ──────────────────────────────────────
function header(showNew=true) {
  const { title, tagline } = S.cfg;
  const parts = title.split('-');
  const name = parts.length > 1
    ? `<b>${parts[0]}-</b>${parts.slice(1).join('-')}`
    : esc(title);
  return `<div id="hdr">
    <div id="hdr-inner">
      <span id="blog-name" onclick="goList()">${name}</span>
      ${tagline ? `<span id="hdr-tagline">${esc(tagline)}</span>` : ''}
      <nav id="hdr-nav">
        ${showNew ? `<button class="nav-btn nav-new" onclick="goEditor(null)">+ novo post</button>` : ''}
        <button class="nav-btn" onclick="exportBackup()">backup</button>
        <button class="nav-btn" onclick="openCfg()">configurar</button>
      </nav>
    </div>
  </div>`;
}

// ── Sidebar ──────────────────────────────────────
function sidebar() {
  const months = {};
  S.posts.forEach(p => {
    const d = new Date(p.date);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const l = `${'jan fev mar abr mai jun jul ago set out nov dez'.split(' ')[d.getMonth()]} ${d.getFullYear()}`;
    months[k] = months[k] || { l, n: 0 };
    months[k].n++;
  });
  const monthList = Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14);
  const tagCount = {};
  S.posts.forEach(p => (p.tags||[]).forEach(t => { tagCount[t] = (tagCount[t]||0)+1; }));
  const tagList = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,24);

  const aboutHtml = S.cfg.about
    ? `<div class="sb-section"><div class="sb-label">sobre</div><div style="font-size:13px;line-height:1.6;color:var(--muted)">${renderMd(S.cfg.about)}</div></div>`
    : '';

  return `<aside id="sidebar">
    ${aboutHtml}
    ${tagList.length ? `<div class="sb-section">
      <div class="sb-label">temas</div>
      ${tagList.map(([t,n])=>`<button class="sb-link" onclick="filterTag('${esc(t)}')">${esc(t)} <span class="sb-count">(${n})</span></button>`).join('')}
    </div>` : ''}
    ${monthList.length ? `<div class="sb-section">
      <div class="sb-label">arquivo</div>
      ${monthList.map(([k,m])=>`<button class="sb-link" onclick="filterMonth('${k}')">${m.l} <span class="sb-count">(${m.n})</span></button>`).join('')}
    </div>` : ''}
    <div class="sb-section">
      <div class="sb-label">total</div>
      <span style="font-family:var(--fm);font-size:12px;color:var(--muted)">${S.posts.length} ${S.posts.length===1?'post':'posts'}</span>
    </div>
  </aside>`;
}

// ── List view ────────────────────────────────────
function vList() {
  let posts = S.posts;
  let filterBar = '';

  if (S.filterTag) {
    posts = posts.filter(p=>(p.tags||[]).includes(S.filterTag));
    filterBar = `<div id="filter-bar">tema: <span class="tag on">${esc(S.filterTag)}</span>
      <button class="filter-clear" onclick="clearFilter()">× limpar filtro</button></div>`;
  }
  if (S.filterMonth) {
    posts = posts.filter(p=>{
      const d = new Date(p.date);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` === S.filterMonth;
    });
    filterBar = `<div id="filter-bar">arquivo: <span style="font-family:var(--fm);font-size:11px;color:var(--text)">${S.filterMonth}</span>
      <button class="filter-clear" onclick="clearFilter()">× limpar filtro</button></div>`;
  }

  const content = posts.length === 0
    ? `<div class="empty-state">
        <p>${S.posts.length === 0 ? 'nenhum post ainda.' : 'nenhum post com esse filtro.'}</p>
        ${S.posts.length === 0 ? `<button onclick="goEditor(null)">escrever primeiro post</button>` : ''}
       </div>`
    : posts.map(postCard).join('');

  return `${header()}
    <div id="layout">
      <main>${filterBar}${content}</main>
      ${sidebar()}
    </div>`;
}

function postCard(p) {
  const tags = (p.tags||[]).map(t=>`<span class="tag" onclick="filterTag('${esc(t)}')">${esc(t)}</span>`).join('');
  return `<article class="p-item">
    <div class="p-date">${fmtDate(p.date)}</div>
    <h2 class="p-title"><a onclick="goPost('${p.id}')">${esc(p.title)}</a></h2>
    <p class="p-excerpt">${esc(excerpt(p.content))}</p>
    <div class="p-footer">${tags}<button class="read-more" onclick="goPost('${p.id}')">continuar lendo →</button></div>
  </article>`;
}

// ── Single post view ──────────────────────────────
function vPost() {
  const p = S.posts.find(x => x.id === S.currentId);
  if (!p) { S.view='list'; return vList(); }
  const tags = (p.tags||[]).map(t=>`<span class="tag" onclick="filterTag('${esc(t)}')">${esc(t)}</span>`).join('');
  return `${header()}
    <div id="layout">
      <main>
        <button class="back-btn" onclick="goList()">← voltar</button>
        <h1 class="s-title">${esc(p.title)}</h1>
        <div class="s-meta">
          <span>${fmtDateLong(p.date)}</span>
          ${tags}
          <div class="s-actions">
            <button class="btn-edit" onclick="goEditor('${p.id}')">editar</button>
            <button class="btn-del-sm" onclick="delPost('${p.id}')">excluir</button>
          </div>
        </div>
        <div class="md">${renderMd(p.content)}</div>
      </main>
      ${sidebar()}
    </div>`;
}

// ── Editor view ───────────────────────────────────
function vEditor() {
  const p = S.editPost;
  const isNew = !p || !p.id;
  const tags = (p && p.tags ? p.tags.join(', ') : '');
  return `${header(false)}
    <div id="layout" style="grid-template-columns:1fr;max-width:820px">
      <div>
        <div class="ed-header">
          <span class="ed-heading">${isNew ? 'novo post' : 'editar post'}</span>
          <button class="ed-cancel" onclick="goList()">cancelar</button>
        </div>
        <div class="ed-field">
          <label class="ed-label">título</label>
          <input class="ed-input" id="ed-title" type="text" value="${esc(p && p.title || '')}" placeholder="Título do post">
        </div>
        <div class="ed-field">
          <label class="ed-label">tags <span style="opacity:.5">(separadas por vírgula)</span></label>
          <input class="ed-input mono" id="ed-tags" type="text" value="${esc(tags)}" placeholder="filosofia, cultura, música">
        </div>
        <div class="ed-field">
          <label class="ed-label">conteúdo (markdown)</label>
          <div id="ed-toolbar">
            <button class="tb" onclick="tb('bold')" title="Negrito"><b>N</b></button>
            <button class="tb" onclick="tb('italic')" title="Itálico"><i>I</i></button>
            <button class="tb" onclick="tb('h2')">H2</button>
            <button class="tb" onclick="tb('h3')">H3</button>
            <div class="tb-sep"></div>
            <button class="tb" onclick="tb('link')">link</button>
            <button class="tb" onclick="tb('quote')">❝</button>
            <button class="tb" onclick="tb('code')">{ }</button>
            <button class="tb" onclick="tb('hr')">—</button>
            <div class="tb-sep"></div>
            <button class="tb" onclick="pickImg()" title="Inserir imagem">img ↑</button>
            <button class="tb" onclick="pickVideo()" title="Embutir vídeo">vídeo ↑</button>
          </div>
          <div class="ed-tabs">
            <button class="ed-tab on" id="tab-w" onclick="swTab('write')">escrever</button>
            <button class="ed-tab" id="tab-p" onclick="swTab('preview')">prévia</button>
          </div>
          <textarea id="ed-body" placeholder="Escreva em markdown…

**negrito**  *itálico*  ## título  > citação  \`código\`
![alt](url-da-imagem)
{{video:https://youtube.com/watch?v=ID}}"></textarea>
          <div id="preview-body" class="md hidden"></div>
        </div>
        <div class="ed-actions">
          <button class="btn-pub" onclick="publish()">publicar</button>
          <button class="btn-sec" onclick="goList()">descartar</button>
          ${!isNew ? `<button class="btn-del-ed" onclick="delPost('${p.id}')">excluir post</button>` : ''}
        </div>
        <div id="save-msg"></div>
      </div>
    </div>`;

// ═══════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════
function goList() {
  S.view='list'; S.currentId=null; S.editPost=null;
  render(); scrollTo(0,0);
}
function goPost(id) {
  S.view='post'; S.currentId=id;
  render(); scrollTo(0,0);
}
function goEditor(id) {
  S.editPost = id
    ? { ...S.posts.find(p=>p.id===id) }
    : { title:'', content:'', tags:[] };
  S.view='editor'; S.tab='write';
  render(); scrollTo(0,0);
}
function filterTag(t) { S.filterTag=t; S.filterMonth=null; S.view='list'; render(); scrollTo(0,0); }
function filterMonth(m) { S.filterMonth=m; S.filterTag=null; S.view='list'; render(); scrollTo(0,0); }
function clearFilter() { S.filterTag=null; S.filterMonth=null; render(); }

// ═══════════════════════════════════════════════
//  EDITOR ACTIONS
// ═══════════════════════════════════════════════
function swTab(tab) {
  S.tab = tab;
  const ew = document.getElementById('ed-body');
  const ep = document.getElementById('preview-body');
  const tw = document.getElementById('tab-w');
  const tp = document.getElementById('tab-p');
  if (!ew || !ep || !tw || !tp) return;
  if (tab === 'write') {
    ew.classList.remove('hidden'); ep.classList.add('hidden');
    tw.classList.add('on'); tp.classList.remove('on');
  } else {
    ew.classList.add('hidden'); ep.classList.remove('hidden');
    tw.classList.remove('on'); tp.classList.add('on');
    ep.innerHTML = renderMd(ew.value);
  }
}

function tb(type) {
  const ta = document.getElementById('ed-body');
  if (!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const map = {
    bold:   ['**','**','negrito'],
    italic: ['*','*','itálico'],
    code:   ['`','`','código'],
    link:   ['[','](https://)','texto'],
    quote:  ['> ','',''],
    h2:     ['## ','',''],
    h3:     ['### ','',''],
    hr:     ['\n---\n','',''],
  };
  const [pre, post, ph] = map[type] || ['','',''];
  const text = pre + (sel || ph) + post;
  ta.value = ta.value.slice(0,s) + text + ta.value.slice(e);
  ta.focus();
  const np = s + pre.length + (sel || ph).length;
  ta.setSelectionRange(np, np);
}

function insertAt(ta, text) {
  if (!ta) return;
  const s = ta.selectionStart;
  ta.value = ta.value.slice(0,s) + text + ta.value.slice(ta.selectionEnd);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.focus();
}

function pickImg() {
  document.getElementById('file-input').click();
}

function pickVideo() {
  const url = prompt('Cole a URL do vídeo (YouTube ou Vimeo):');
  if (url && url.trim()) {
    insertAt(document.getElementById('ed-body'), `\n{{video:${url.trim()}}}\n`);
  }
}

// Image upload → resize → base64 → insert
document.getElementById('file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1400;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const b64 = canvas.toDataURL('image/jpeg', 0.8);
      const alt = file.name.replace(/\.[^.]+$/,'');
      insertAt(document.getElementById('ed-body'), `\n![${alt}](${b64})\n`);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  this.value = '';
});

// ─── Publish ──────────────────────────────────────
async function publish() {
  const title   = document.getElementById('ed-title')?.value?.trim();
  const content = document.getElementById('ed-body')?.value?.trim();
  const tagsRaw = document.getElementById('ed-tags')?.value?.trim();
  const msg     = document.getElementById('save-msg');

  if (!title)   { msg.textContent='⚠ adicione um título.'; return; }
  if (!content) { msg.textContent='⚠ escreva algo.'; return; }

  const tags = tagsRaw ? tagsRaw.split(',').map(t=>t.trim()).filter(Boolean) : [];
  const prev = S.editPost;
  const isNew = !prev || !prev.id;

  const post = {
    id:      prev.id || `${slugify(title)}-${uid()}`,
    title,
    content,
    tags,
    date:    prev.date || new Date().toISOString(),
    updated: new Date().toISOString(),
  };

  await db.savePost(post);

  if (isNew) {
    S.posts.unshift(post);
  } else {
    const i = S.posts.findIndex(p=>p.id===post.id);
    if (i >= 0) S.posts[i] = post; else S.posts.unshift(post);
  }
  S.posts.sort((a,b)=>new Date(b.date)-new Date(a.date));

  S.currentId = post.id;
  S.view = 'post';
  S.editPost = null;
  render(); scrollTo(0,0);
}

// ─── Delete ───────────────────────────────────────
async function delPost(id) {
  if (!confirm('Excluir este post? Essa ação não pode ser desfeita.')) return;
  await db.delPost(id);
  S.posts = S.posts.filter(p=>p.id!==id);
  goList();
}

// ═══════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════
function openCfg() {
  document.getElementById('cfg-title').value   = S.cfg.title;
  document.getElementById('cfg-tagline').value = S.cfg.tagline || '';
  document.getElementById('cfg-about').value   = S.cfg.about  || '';
  document.getElementById('cfg-overlay').classList.add('open');
}
function closeCfg() {
  document.getElementById('cfg-overlay').classList.remove('open');
}
async function saveCfg() {
  const title   = document.getElementById('cfg-title').value.trim()   || 'blog';
  const tagline = document.getElementById('cfg-tagline').value.trim();
  const about   = document.getElementById('cfg-about').value.trim();
  S.cfg = { title, tagline, about };
  await db.saveCfg(S.cfg);
  document.title = title;
  closeCfg();
  render();
}

// ═══════════════════════════════════════════════
//  BACKUP (exportar/importar JSON — recomendado periodicamente)
// ═══════════════════════════════════════════════
async function exportBackup() {
  const json = await db.exportAll();
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `blog-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    try {
      await db.importAll(text);
      alert('Backup importado com sucesso!');
      location.reload();
    } catch (err) {
      alert('Erro ao importar: ' + err.message);
    }
  };
  input.click();
}

    title: 'Realismo Capitalista e o Fim do Futuro',
    content: `É mais fácil imaginar o fim do mundo do que o fim do capitalismo. Essa frase, atribuída vagamente a Fredric Jameson e Slavoj Žižek, nunca foi tão literal quanto agora.

## O horizonte fechado

Mark Fisher chamou de **realismo capitalista** essa condição peculiar: não a crença de que o capitalismo é bom, mas a incapacidade de imaginar qualquer coisa fora dele. Não se trata de ideologia no sentido clássico — uma visão de mundo que precisamos combater com argumentos. É algo mais profundo: uma textura do real, um clima afetivo.

O sintoma mais evidente está na cultura pop. Os filmes de super-heróis: a ameaça é sempre a destruição total da civilização, nunca sua transformação. O vilão quer matar bilhões, o herói quer salvar o status quo. Ninguém, em nenhum momento, questiona *por que* o mundo funciona como funciona.

> A melancolia não é uma falha moral. É a resposta adequada a uma situação em que o futuro foi sequestrado.

## A privatização do estresse

O neoliberalismo não apenas privatizou serviços públicos — privatizou o sofrimento. Quando você está deprimido, ansioso, esgotado, a narrativa disponível é sempre individual: falta de resiliência, desequilíbrio químico, escolhas pessoais erradas.

A ideia de que o sofrimento pode ter causas *estruturais* torna-se impensável.

## O que resta

A questão não é ser otimista ou pessimista. É recusar a aceitação tácita de que as coisas são assim porque precisam ser assim. O realismo capitalista se sustenta enquanto parece natural, inevitável, *realista*. A primeira fissura é perceber que ele é histórico — que tem começo, e pode ter fim.`,

## O passado que nunca existiu

Há uma diferença crucial entre lembrar e nostalgiar. A lembrança é imperfeita, fragmentada, atravessada pelo presente. A nostalgia é uma operação de limpeza: extrai do passado o que havia de angustiante, incerto, sujo, e entrega de volta uma imagem polida.

Os "anos 80" da cultura pop não existiram. Existiu uma década com AIDS, crack, dívidas externas, ditaduras em decomposição. O que nos é vendido como os anos 80 é o recorte que sobrou depois de remover tudo isso.

## A máquina retroativa

O que me interessa não é a nostalgia pessoal — aquela que surge involuntariamente diante de um cheiro ou de uma canção — mas a **nostalgia produzida industrialmente**. Séries que citam décadas que já eram citações. Vinis. Cafeterias que parecem 1962. Moda que cita moda que citava moda.

> Quando não conseguimos imaginar o futuro, somos empurrados de volta para versões sanitizadas do passado.

## O que fazer com isso

Os situacionistas tinham um conceito: *détournement* — pegar elementos da cultura dominante e redirecioná-los contra ela. O passado como material, não como refúgio.`,

A escuta como forma de atenção total é uma prática que estamos perdendo — não por falta de música, mas por excesso de contexto. A música virou trilha sonora de outra coisa: do trabalho, do deslocamento, do treino, do sono.

## O que se perde na escuta parcial

Quando você ouve uma música enquanto responde emails, você não a ouve de verdade — você processa algo que se parece com ela. A música entra, cumpre sua função reguladora de humor, e sai sem deixar marca.

> Toda obra de arte exige que você vá até ela. Ela não vem até você.

## Um experimento

Nos últimos meses, tentei reservar tempo específico para ouvir — sem fazer mais nada. O que acontece é estranho: a música fica maior. Detalhes que sempre estiveram lá — uma linha de baixo, uma respiração no microfone, uma dissonância resolvida — emergem como se pela primeira vez.

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
async function init() {
  const cfg = await db.loadCfg();
  if (cfg) S.cfg = cfg;
  document.title = S.cfg.title;

  let posts = await db.loadPosts();
  if (posts.length === 0) {
    for (const p of SAMPLES) await db.savePost(p);
    posts = SAMPLES;
  }
  S.posts = posts;
  render();
}

init();
